<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kürşad ARAS - App Developer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #1e1e1e;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 85%;
            text-align: center;
        }
        h1 {
            margin: 0 0 5px 0;
            color: #4CAF50;
            font-size: 26px;
            letter-spacing: 1px;
        }
        .subtitle {
            color: #888;
            font-size: 15px;
            margin-bottom: 30px;
        }
        .projects {
            text-align: left;
            margin-top: 20px;
        }
        .projects h2 {
            font-size: 16px;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
            color: #ccc;
        }
        .project-item {
            margin: 15px 0;
            padding: 12px;
            background: #2a2a2a;
            border-radius: 8px;
            border-left: 4px solid #4CAF50;
            transition: transform 0.2s;
        }
        .project-item:hover {
            transform: translateX(5px);
        }
        .project-item strong {
            display: block;
            color: #fff;
            font-size: 16px;
            margin-bottom: 4px;
        }
        .project-item span {
            font-size: 13px;
            color: #aaa;
        }
        .footer-links {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .footer-links a {
            color: #4CAF50;
            text-decoration: none;
            font-size: 13px;
            transition: color 0.2s;
        }
        .footer-links a:hover {
            color: #81C784;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Kürşad ARAS</h1>
        <div class="subtitle">Software Developer | Mobile & Desktop Apps</div>

        <div class="projects">
            <h2>Öne Çıkan Uygulamalar</h2>
            <div class="project-item">
                <strong>TabuKA - Kelime Arenası</strong>
                <span>Çok platformlu Türkçe parti oyunu.</span>
            </div>
        </div>

        <div class="footer-links">
            <a href="/app-ads.txt" target="_blank">app-ads.txt</a>
            <a href="#">Gizlilik Politikası</a>
            <a href="mailto:iletisim@adresiniz.com">İletişim</a>
        </div>
    </div>
</body>
</html>
